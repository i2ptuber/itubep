<!DOCTYPE html>
<html lang="{{ lang|default('en') }}">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}ITubeP{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <!-- Строки текущего языка сайта для клиентского JS (плеер, мастер
         публикации) — см. static/i18n.js. Язык независим от языка моста.
         ВАЖНО: должно грузиться в head, ДО скриптов из блока content
         (player.js, инлайн-скрипт publish.html) — они вызывают window.t()
         сразу же, в некоторых случаях (уже сопряжённый пользователь —
         getOrCreateToken() резолвится микротаском без похода в сеть)
         быстрее, чем браузер успел бы дойти до этого script-тега, если бы
         он стоял в конце body, как раньше. -->
    <script>window.ITUBEP_STRINGS = {{ js_strings|tojson }};</script>
    <script src="/static/i18n.js"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
    <header>
        <a href="/" class="logo">ITubeP</a>
        <a href="/publish" class="publish-link">{{ t('nav.publish') }}</a>
        <form action="/" method="get" class="search-form">
            <input type="text" name="q" placeholder="{{ t('nav.search_placeholder') }}" value="{{ query|default('') }}">
            <button type="submit">{{ t('nav.search_btn') }}</button>
        </form>

        <!-- Переключатель языка САЙТА — независим от языка моста (тот
             настраивается в настройках моста). Хранится в cookie этого
             браузера, см. app/i18n.py и роут /set-lang в app/main.py. -->
        <a class="lang-switch" href="/set-lang?lang={{ 'ru' if lang == 'en' else 'en' }}&next={{ request.url.path }}{% if request.url.query %}%3F{{ request.url.query|urlencode }}{% endif %}">
            {{ t('lang.switch_to') }}
        </a>

        <div class="account-menu">
            <button type="button" class="account-btn" id="account-btn" aria-haspopup="true" aria-expanded="false" title="{{ t('nav.account_title') }}">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
                </svg>
            </button>
            <div class="account-dropdown" id="account-dropdown" role="menu">
                <!-- Реальный channel_id узнаём на клиенте через мост
                     (GET /bridge/my_channel) — href тут просто разумный
                     fallback, см. static/account-menu.js -->
                <a href="/channel/me" id="nav-my-channel" role="menuitem">{{ t('nav.my_channel') }}</a>
                <a href="/studio" role="menuitem">{{ t('nav.studio') }}</a>
                <!-- Менеджер каналов — реализуется на стороне моста, отдельная большая задача -->
                <a href="/channels" role="menuitem">{{ t('nav.channel_manager') }}</a>
                <div class="menu-divider"></div>
                <!-- Открывает настройки моста. Сопряжение запрашивается так
                     же, как при просмотре/публикации видео (см.
                     static/account-menu.js); мост дополнительно проверяет,
                     что запрос пришёл от уже сопряжённого (авторизованного)
                     origin, прежде чем открыть окно — см.
                     bridge/policy/authz.py:open_bridge_settings.
                     Язык, который увидит пользователь в окне настроек моста,
                     определяется настройками САМОГО МОСТА (bridge/i18n.py),
                     а не языком сайта — это две независимые настройки. -->
                <button type="button" class="menu-item-btn" id="open-bridge-settings" role="menuitem">{{ t('nav.bridge_settings') }}</button>
                <a href="/rules" role="menuitem">{{ t('nav.rules') }}</a>
                <a href="/about" role="menuitem">{{ t('nav.about') }}</a>
            </div>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="/static/account-menu.js"></script>
    <script src="/static/nsfw-sync.js"></script>
</body>
</html>
